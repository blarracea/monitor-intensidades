<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monitor de Sismos — Chile y Sudamérica</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <header class="app-header">
    <h1>Monitor de Sismos — Chile y Sudamérica</h1>
  </header>

  <main class="app-main">
    <div class="top-row">
      <section class="panel day-table">
        <h2>Sismos por día</h2>
        <div class="day-table-controls">
          <input type="date" id="day-picker" />
        </div>
        <div class="day-table-wrap">
          <table id="day-table">
            <thead>
              <tr><th>Hora</th><th>Lugar</th><th>Mag.</th></tr>
            </thead>
            <tbody id="day-table-body"></tbody>
          </table>
        </div>
        <p id="status" class="status">Cargando datos...</p>
      </section>

      <section class="panel legend">
        <h2>Capas</h2>
        <label class="layer-toggle">
          <input type="checkbox" id="toggle-heatmap" checked />
          Intensidad percibida — CSN/SENAPRED (oficial)
        </label>
        <label class="layer-toggle" title="RSS de medios, no es intensidad Mercalli verificada">
          <input type="checkbox" id="toggle-social" />
          Menciones en redes (no verificado)
        </label>
        <div class="legend-scale">
          <span style="background:#14328c"></span>
          <span style="background:#1f6fe0"></span>
          <span style="background:#1fb5e0"></span>
          <span style="background:#22c7a0"></span>
          <span style="background:#6fcf3e"></span>
          <span style="background:#c6d823"></span>
          <span style="background:#f7b500"></span>
          <span style="background:#f2701f"></span>
          <span style="background:#e8382a"></span>
          <span style="background:#ff2fb0"></span>
        </div>
        <div class="legend-ticks">
          <span>I</span><span>II</span><span>III</span><span>IV</span><span>V</span>
          <span>VI</span><span>VII</span><span>VIII</span><span>IX</span><span>X</span>
        </div>
        <div class="legend-labels">
          <span>Leve</span><span>Fuerte</span>
        </div>
      </section>

      <section id="event-detail" class="panel event-detail">
        <h2>Detalle del evento</h2>
        <p id="event-detail-placeholder" class="event-detail-placeholder">Hacé click en un sismo (mapa o tabla) para ver el detalle.</p>
        <dl id="event-detail-body"></dl>
      </section>
    </div>

    <div class="bottom-row">
      <div id="map"></div>

      <aside class="panel social-feed">
        <h2>Menciones en medios <span class="social-feed-tag">no verificado</span></h2>
        <div id="social-feed-body">Cargando...</div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="js/data-loader.js?v=10"></script>
  <script src="js/map.js?v=10"></script>
  <script src="js/heatmap.js?v=10"></script>
  <script src="js/social-layer.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
