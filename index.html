<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monitor de Sismos — Chile y Sudamérica</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <header class="app-header">
    <h1>Monitor de Sismos — Chile y Sudamérica</h1>
  </header>

  <main class="app-main">
    <div id="map"></div>

    <aside id="sidebar" class="sidebar">
      <section class="legend">
        <h2>Capas</h2>
        <label class="layer-toggle">
          <input type="checkbox" id="toggle-heatmap" checked />
          Intensidad percibida — DYFI (oficial)
        </label>
        <label class="layer-toggle layer-toggle--disabled" title="Próximamente — Fase 2">
          <input type="checkbox" id="toggle-social" disabled />
          Menciones en redes (no verificado) — Próximamente
        </label>
        <div class="legend-scale">
          <span style="background:#14328c"></span>
          <span style="background:#1f6fe0"></span>
          <span style="background:#1fb5e0"></span>
          <span style="background:#22c7a0"></span>
          <span style="background:#6fcf3e"></span>
          <span style="background:#c6d823"></span>
          <span style="background:#f7b500"></span>
          <span style="background:#f2701f"></span>
          <span style="background:#e8382a"></span>
          <span style="background:#ff2fb0"></span>
        </div>
        <div class="legend-ticks">
          <span>I</span><span>II</span><span>III</span><span>IV</span><span>V</span>
          <span>VI</span><span>VII</span><span>VIII</span><span>IX</span><span>X</span>
        </div>
        <div class="legend-labels">
          <span>Leve</span><span>Fuerte</span>
        </div>
      </section>

      <section id="event-detail" class="event-detail hidden">
        <h2>Detalle del evento</h2>
        <dl id="event-detail-body"></dl>
      </section>

      <section id="status" class="status">Cargando datos...</section>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="js/data-loader.js?v=4"></script>
  <script src="js/map.js?v=4"></script>
  <script src="js/heatmap.js?v=4"></script>
  <script src="js/social-layer.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
