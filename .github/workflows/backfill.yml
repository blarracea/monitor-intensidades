name: Recuperar historial de sismos anteriores

# COPIA DE REFERENCIA (ver el encabezado de collect.yml): el archivo que se ejecuta vive en
# el repo PUBLICO; este repo privado tiene Actions deshabilitado.
#
# Se dispara SOLO a mano (Actions > "Recuperar historial..." > Run workflow, o
# `gh workflow run backfill.yml`). Recupera publicaciones (Bluesky, Mastodon) y noticias
# (Google News) de sismos anteriores al archivo continuo -- ver backend/backfill.py en el
# repo privado. Necesita correr aca y no en un computador propio porque la busqueda de
# Bluesky usa los secrets del repositorio.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Grupo propio (no "collect-sismos"): con cancel-in-progress ese grupo cancelaria esta
# corrida cada 5 minutos, cuando llega el disparo de la recoleccion.
concurrency:
  group: backfill-sismos
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sitio y datos, repo publico)
        uses: actions/checkout@v4

      - name: Checkout del codigo del recolector (repo privado)
        uses: actions/checkout@v4
        with:
          repository: blarracea/monitor-intensidades-backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: _backend
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r _backend/backend/requirements.txt

      # La recoleccion normal (cada 5 min) tambien commitea en data/archive/ -- si el push
      # choca, se descarta este commit y se REHACE la recuperacion sobre lo ultimo (es
      # idempotente: solo agrega enlaces nuevos).
      - name: Recuperar y commitear
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          SISMOS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          run_backfill() {
            local status=0
            python _backend/backend/backfill.py 2> "$RUNNER_TEMP/backfill.err" || status=$?
            # Registro publico: se quitan las lineas de codigo fuente (sangradas) del traceback.
            grep -vE '^[[:space:]]{4,}' "$RUNNER_TEMP/backfill.err" >&2 || true
            return $status
          }
          for attempt in 1 2 3; do
            run_backfill
            git add data/archive/
            if git diff --cached --quiet; then
              echo "Sin cambios nuevos."
              exit 0
            fi
            git commit -m "Recupera publicaciones y noticias de sismos anteriores"
            if git pull --rebase origin master && git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt), se rehace sobre lo ultimo."
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/master
          done
          exit 1
