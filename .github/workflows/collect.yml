name: Recolectar datos de sismos

# El self-encadenado (un job que se queda corriendo horas y se re-dispara
# solo) quedo descartado: aunque funcionaba, factura como "en ejecucion"
# TODO el tiempo que el job esta vivo, incluido el tiempo dormido entre
# recolecciones.
#
# El minuto de GitHub Actions no es la restriccion (el repo es publico:
# minutos ilimitados y gratis, sin tope mensual, para cualquier plan de
# cuenta). El problema real es otro: GitHub NO garantiza que un "schedule"
# muy frecuente se dispare de verdad con esa cadencia -- bajo carga de la
# plataforma, descarta la mayoria de los disparos de un cron cada 5 min
# (medido: 14 corridas reales en 24 horas contra las 288 que deberian
# haber sido). Se subio a cada 15 min y el problema persistio igual --
# revisando el historial real de corridas (gh run list) los espacios entre
# corridas "schedule" llegan hasta 2-2.5 horas, no 15-20 minutos. O sea el
# numero exacto del cron (15 vs 20) no es la causa ni la solucion: es
# GitHub descartando disparos bajo carga, pase lo que pase. Se sube a 20
# min de todos modos (pide un poco menos al scheduler) y se re-registro el
# workflow (disable/enable) por si eso resetea algo del lado de GitHub,
# pero la causa de fondo sigue siendo la misma y no depende de este
# archivo. La alternativa real (un disparador externo con token de GitHub)
# se descarto por ahora a pedido explicito: se evita meter un token nuevo
# cuyo consumo/duracion no esta claro.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda mas de lo esperado -- la
# nueva espera a que termine la anterior en vez de correr en paralelo y
# generar conflictos de git push.
concurrency:
  group: collect-sismos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Instalar Chromium (Playwright, para leer el reporte de SENAPRED)
        run: python -m playwright install --with-deps chromium

      - name: Recolectar sismos
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python backend/collect.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualiza datos de sismos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin master
            git push
          fi
