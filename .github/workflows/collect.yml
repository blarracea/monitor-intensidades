name: Recolectar datos de sismos

on:
  schedule:
    # El cron nativo de "schedule" es "best effort" -- en la practica corre
    # cada 1-3+ horas en vez de respetar el intervalo configurado, sin
    # importar que tan seguido se pida (se probo con */5). Un
    # workflow_dispatch (disparo explicito, no cron) SI corre casi al
    # instante -- por eso la cadencia real de 5 min la maneja un servicio
    # externo (cron-job.org) llamando a la API de disparo cada 5 min. Este
    # cron nativo queda solo como red de respaldo de baja frecuencia, por
    # si ese servicio externo alguna vez falla o el token vence.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda mas de 5 minutos (Playwright
# contra senapred.cl puede ser lento) -- la nueva espera a que termine la
# anterior en vez de correr en paralelo y generar conflictos de git push.
concurrency:
  group: collect-sismos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Instalar Chromium (Playwright, para leer el reporte de SENAPRED)
        run: python -m playwright install --with-deps chromium

      - name: Recolectar sismos
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python backend/collect.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualiza datos de sismos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin master
            git push
          fi
