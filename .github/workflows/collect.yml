name: Recolectar datos de sismos

# El self-encadenado (un job que se queda corriendo horas y se re-dispara
# solo) quedo descartado: aunque funcionaba, factura como "en ejecucion"
# TODO el tiempo que el job esta vivo, incluido el tiempo dormido entre
# recolecciones.
#
# Antes esto corria en 13 horarios fijos por dia (~108 min entre si) para
# quedar dentro de un presupuesto autoimpuesto de 200 min/mes -- pero el
# repo es publico, y GitHub Actions da minutos ilimitados y gratis en repos
# publicos, sin tope mensual, para cualquier plan de cuenta (no es que este
# repo particular tenga un limite mas chico -- es politica fija de GitHub).
# Ese presupuesto de 200 min no reflejaba una restriccion real, asi que se
# volvio al intervalo simple de 5 minutos (el minimo real que permite un
# cron de GitHub Actions -- no se puede programar mas seguido). A ~1.55 min
# facturados por corrida en promedio (71s reales, redondeado hacia arriba
# al minuto), son ~13.800 min/mes -- gratis igual, por ser repo publico.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda mas de lo esperado -- la
# nueva espera a que termine la anterior en vez de correr en paralelo y
# generar conflictos de git push.
concurrency:
  group: collect-sismos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Instalar Chromium (Playwright, para leer el reporte de SENAPRED)
        run: python -m playwright install --with-deps chromium

      - name: Recolectar sismos
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python backend/collect.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualiza datos de sismos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin master
            git push
          fi
