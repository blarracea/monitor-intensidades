name: Recolectar datos de sismos

# El self-encadenado (un job que se queda corriendo horas y se re-dispara
# solo) quedo descartado: aunque funcionaba, factura como "en ejecucion"
# TODO el tiempo que el job esta vivo, incluido el tiempo dormido entre
# recolecciones -- eso es gratis en un repo publico (minutos ilimitados),
# pero el usuario quiere mantenerse dentro de los 200 minutos gratuitos
# mensuales de un plan mas ajustado, y para eso cada corrida tiene que
# facturar solo su tiempo real de ejecucion (~1 minuto), no las horas de
# espera intermedias.
#
# Por eso se vuelve a un job simple de una sola pasada (arranca, recolecta,
# termina), disparado por horarios fijos en vez de un intervalo. 108
# minutos (lo que el usuario calculo para ~13 corridas/dia dentro de su
# presupuesto) no divide 24 horas de forma pareja, asi que en vez de tratar
# de expresar "cada 108 min" en sintaxis de cron (no se puede directamente)
# se listan 13 horarios fijos por dia espaciados exactamente 108 minutos
# entre si -- el unico tramo mas largo es el nocturno, de 21:36 a 00:00
# (144 min), inevitable porque 108 no divide 1440 (los minutos del dia) de
# forma exacta.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "48 1 * * *"
    - cron: "36 3 * * *"
    - cron: "24 5 * * *"
    - cron: "12 7 * * *"
    - cron: "0 9 * * *"
    - cron: "48 10 * * *"
    - cron: "36 12 * * *"
    - cron: "24 14 * * *"
    - cron: "12 16 * * *"
    - cron: "0 18 * * *"
    - cron: "48 19 * * *"
    - cron: "36 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda mas de lo esperado -- la
# nueva espera a que termine la anterior en vez de correr en paralelo y
# generar conflictos de git push.
concurrency:
  group: collect-sismos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Instalar Chromium (Playwright, para leer el reporte de SENAPRED)
        run: python -m playwright install --with-deps chromium

      - name: Recolectar sismos
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python backend/collect.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualiza datos de sismos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin master
            git push
          fi
