name: Recolectar datos de sismos

# El self-encadenado (un job que se queda corriendo horas y se re-dispara
# solo) quedo descartado: aunque funcionaba, factura como "en ejecucion"
# TODO el tiempo que el job esta vivo, incluido el tiempo dormido entre
# recolecciones.
#
# El minuto de GitHub Actions no es la restriccion (el repo es publico:
# minutos ilimitados y gratis, sin tope mensual, para cualquier plan de
# cuenta). El problema real es otro: GitHub NO garantiza que un "schedule"
# muy frecuente se dispare de verdad con esa cadencia -- bajo carga de la
# plataforma, descarta la mayoria de los disparos de un cron cada 5 min
# (medido: 14 corridas reales en 24 horas contra las 288 que deberian
# haber sido -- el ultimo dato quedaba de hasta 3-4 horas de antiguedad).
# No es algo que se arregle desde este archivo con un cron mas agresivo --
# ya se probo "*/5 * * * *" y el resultado fue el mismo problema. Cada 15
# minutos es un intervalo menos exigente para el scheduler de GitHub, y en
# la practica se cumple con mucha mas consistencia (igual puede atrasarse
# ocasionalmente, pero no de la misma forma masiva que cada 5 min).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda mas de lo esperado -- la
# nueva espera a que termine la anterior en vez de correr en paralelo y
# generar conflictos de git push.
concurrency:
  group: collect-sismos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Instalar Chromium (Playwright, para leer el reporte de SENAPRED)
        run: python -m playwright install --with-deps chromium

      - name: Recolectar sismos
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python backend/collect.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "sismos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualiza datos de sismos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin master
            git push
          fi
